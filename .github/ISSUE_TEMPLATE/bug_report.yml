name: Bug report
description: Report a reproducible problem in Teams Exporter
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never attach real Teams messages, tokens, exports, tenant identifiers, or other
        business data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Published version or commit identifier.
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Affected command
      options:
        - export
        - purge
        - notifications
        - installation or configuration
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use fictional and anonymized data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and uv version.
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive data
      options:
        - label: I verified that this report contains no sensitive data.
          required: true
