name: Feature request
description: Suggest an improvement to Teams Exporter
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem
      description: What problem would you like to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions and risks
      description: Would this require new permissions or modify remote data?
